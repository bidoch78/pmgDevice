<!doctype html><html lang="fr">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width,initial-scale=1">
        <title>Device TFT Simulator</title>
        
        <style>
            body{font:15px system-ui;background:#121923;color:#e7edf5;margin:0;padding:24px}
            main{max-width:850px;margin:auto}
            canvas{ background:#1b2532;box-sizing:border-box}
            label{display:block;margin:12px 0}
            input{padding:6px}input[type=range]{width:260px;max-width:90%}
            textarea{box-sizing:border-box;width:100%;height:290px;background:#202b3a;color:#fff;padding:12px}
            button{padding:9px 13px;cursor:pointer;margin:4px}
            section{background:#1b2532;padding:16px;border-radius:10px;margin:16px 0}
            #error{color:#ffbf35;white-space:pre-wrap}
            .coninfo > label { display: inline; }
            @font-face {
                font-family: 'Dashboard';
                src: url('DIN1451-36breit.ttf') format('truetype');
            }

        </style>
            
        </head>
        
    <body>
        <main>
            <h1>Device TFT Simulator</h1>
            <section>

                <div class="coninfo">
                    <label>MAC <input id="mac" placeholder="02:00:00:00:00:01" value="8a:14:a3:39:4d:2e"></label>
                    <label>Token <input id="token" placeholder="" value=""></label>
                    <label>Hub IP <input id="hubUrl" size="38" placeholder="ws://127.0.0.1:3000"></label>
                </div>
                <label>Screen <select id="screen">
                        <option data-round="" data-width="" data-height="">-</option>
                        <option data-round="true" data-width="480" data-height="480">TFT Round 480*480</option>
                        <option data-round="" data-width="480" data-height="320">TFT 480*320</option>
                    </select>
                </label>
                
                <button id="readSettings">Read</button>
                <button id="saveSettings">Save</button>
                <button id="clearToken">Clear token</button>
                <p id="error"></p>
                
            </section>
            
            <section>
                <h2>Virtual Screen</h2>
                <canvas id="display"></canvas>
                <label>Water Temp : <output id="tempValue">50</output> °C<br><input id="temp" type="range" min="0" max="130" step="1" value="50"></label>
            </section>
            
            <section>
                <h2>Template JSON</h2><textarea id="templateInfo" spellcheck="false"></textarea>
                <p>
                    <button id="saveTemplate">Enregistrer le template</button>
                    <button id="reload">Recharger</button>
                </p>
            </section>
        </main>
        
        <script type="module" src="/app.js"></script>
    </body>
    
</html>
