services:
  pmgdevice-simulator:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pmgdevice-simulator
    ports:
      - "3002:3002"
    volumes:
      - ./simulator/web:/app/web
      - ./simulator:/app/simulator
      - ./data:/app/data
      - /app/simulator/node_modules
    restart: unless-stopped